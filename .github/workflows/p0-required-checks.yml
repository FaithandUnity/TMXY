name: P0 required checks

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  pull-requests: read

concurrency:
  group: p0-required-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TMXY_BACKEND_BUILDER_IMAGE: ghcr.io/faithandunity/tmxy-backend-builder@sha256:95f30cbb0f406f387a8aa0d4d56323105610ad6fc0629196bc5074847cac90a9
  TMXY_BACKEND_BUILDER_DIGEST: sha256:95f30cbb0f406f387a8aa0d4d56323105610ad6fc0629196bc5074847cac90a9

jobs:
  policy_repository:
    name: policy/repository
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Check out the immutable candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          lfs: false
          persist-credentials: false
      - name: Validate repository and hosted workflow contracts
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\Tests\Contract\Test-RepositoryLayout.ps1" `
            -RebuildRoot $env:GITHUB_WORKSPACE
          & "$env:GITHUB_WORKSPACE\Tests\CI\Test-HostedWorkflowContract.ps1" `
            -RebuildRoot $env:GITHUB_WORKSPACE
      - name: Enforce independent and sensitive-change approvals
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
        shell: pwsh
        env:
          TMXY_GITHUB_READ_CREDENTIAL: ${{ github.token }}
        run: |
          & "$env:GITHUB_WORKSPACE\Tests\CI\Test-HostedPullRequestPolicy.ps1" `
            -Repository '${{ github.repository }}' `
            -PullRequestNumber ${{ github.event.pull_request.number }}

  security_secrets:
    name: security/secrets
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Check out all reachable history without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          lfs: false
          persist-credentials: false
      - name: Scan working tree and reachable history
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\Tests\Contract\Test-SecretPolicy.ps1" `
            -RebuildRoot $env:GITHUB_WORKSPACE

  backend_clang21:
    name: backend/clang21
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          lfs: false
          persist-credentials: false
      - name: Determine whether this run may write the shared cache
        id: cache_authority
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_API_CREDENTIAL: ${{ github.token }}
        run: |
          set -euo pipefail
          protected="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_API_CREDENTIAL}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/branches/main" | jq -r '.protected')"
          echo "protected=${protected}" >> "${GITHUB_OUTPUT}"
      - name: Restore trusted Clang 21 build cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ${{ runner.temp }}/tmxy-clang21-build
          key: tmxy-clang21-${{ runner.os }}-${{ runner.arch }}-ci-linux-clang-${{ hashFiles('Data/Toolchain/toolchain.lock.json') }}-${{ hashFiles('**/conan.lock', '**/conan.lock.json') }}-${{ github.sha }}
          restore-keys: |
            tmxy-clang21-${{ runner.os }}-${{ runner.arch }}-ci-linux-clang-${{ hashFiles('Data/Toolchain/toolchain.lock.json') }}-${{ hashFiles('**/conan.lock', '**/conan.lock.json') }}-
      - name: Pull and verify the locked builder manifest
        shell: bash
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/tmxy-docker-config
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_CREDENTIAL: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "${DOCKER_CONFIG}"
          cleanup_registry_auth() {
            docker logout ghcr.io >/dev/null 2>&1 || true
            rm -f -- "${DOCKER_CONFIG}/config.json"
            rmdir -- "${DOCKER_CONFIG}" 2>/dev/null || true
          }
          trap cleanup_registry_auth EXIT
          printf '%s' "${GHCR_CREDENTIAL}" | docker login ghcr.io \
            --username "${GHCR_USERNAME}" --password-stdin
          docker pull "${TMXY_BACKEND_BUILDER_IMAGE}"
          repo_digests="$(docker image inspect --format '{{json .RepoDigests}}' "${TMXY_BACKEND_BUILDER_IMAGE}")"
          grep --fixed-strings --quiet "${TMXY_BACKEND_BUILDER_DIGEST}" <<< "${repo_digests}"
      - name: Configure, build, and test with Clang 21
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/tmxy-clang21-build"
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges \
            --mount "type=bind,src=${GITHUB_WORKSPACE},dst=/repo,readonly" \
            --mount "type=bind,src=${RUNNER_TEMP}/tmxy-clang21-build,dst=/build" \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=512m \
            "${TMXY_BACKEND_BUILDER_IMAGE}" bash -lc '
              set -euo pipefail
              clang++-21 --version | grep --fixed-strings "21.1.8"
              cmake -S /repo/Backend -B /build -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_CXX_COMPILER=clang++-21 \
                -DTMXY_WARNINGS_AS_ERRORS=ON
              cmake --build /build --parallel 2
              ctest --test-dir /build --output-on-failure
            '
      - name: Save cache only from a protected main run
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cache_authority.outputs.protected == 'true' && success()
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ${{ runner.temp }}/tmxy-clang21-build
          key: tmxy-clang21-${{ runner.os }}-${{ runner.arch }}-ci-linux-clang-${{ hashFiles('Data/Toolchain/toolchain.lock.json') }}-${{ hashFiles('**/conan.lock', '**/conan.lock.json') }}-${{ github.sha }}

  backend_static_analysis:
    name: backend/static-analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          lfs: false
          persist-credentials: false
      - name: Pull and verify the locked builder manifest
        shell: bash
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/tmxy-docker-config
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_CREDENTIAL: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "${DOCKER_CONFIG}"
          cleanup_registry_auth() {
            docker logout ghcr.io >/dev/null 2>&1 || true
            rm -f -- "${DOCKER_CONFIG}/config.json"
            rmdir -- "${DOCKER_CONFIG}" 2>/dev/null || true
          }
          trap cleanup_registry_auth EXIT
          printf '%s' "${GHCR_CREDENTIAL}" | docker login ghcr.io \
            --username "${GHCR_USERNAME}" --password-stdin
          docker pull "${TMXY_BACKEND_BUILDER_IMAGE}"
          repo_digests="$(docker image inspect --format '{{json .RepoDigests}}' "${TMXY_BACKEND_BUILDER_IMAGE}")"
          grep --fixed-strings --quiet "${TMXY_BACKEND_BUILDER_DIGEST}" <<< "${repo_digests}"
      - name: Run locked formatting and clang-tidy analysis
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges \
            --mount "type=bind,src=${GITHUB_WORKSPACE},dst=/repo,readonly" \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=512m \
            "${TMXY_BACKEND_BUILDER_IMAGE}" bash -lc '
              set -euo pipefail
              mapfile -d "" format_files < <(find /repo/Backend \
                -type f \( -name "*.cpp" -o -name "*.h" -o -name "*.hpp" \) -print0)
              clang-format-21 --dry-run --Werror "${format_files[@]}"
              cmake -S /repo/Backend -B /tmp/tmxy-tidy -G Ninja \
                -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_CXX_COMPILER=clang++-21 \
                -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
                -DTMXY_WARNINGS_AS_ERRORS=ON
              mapfile -d "" translation_units < <(find /repo/Backend -type f -name "*.cpp" -print0)
              clang-tidy-21 -p /tmp/tmxy-tidy --warnings-as-errors="*" "${translation_units[@]}"
            '

  backend_postgres_migration:
    name: backend/postgres-migration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          lfs: false
          persist-credentials: false
      - name: Run the digest-locked PostgreSQL 18 migration
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE/Tests/Integration/Test-PostgresMigration.ps1" `
            -RebuildRoot $env:GITHUB_WORKSPACE `
            -OutputPath "$env:RUNNER_TEMP/p0-12-postgres-migration.json"

  client_ue58_execution:
    name: client/ue58-execution
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      - self-hosted
      - Windows
      - X64
      - tmxy-ue58
      - tmxy-ephemeral
    timeout-minutes: 180
    steps:
      - name: Check out source and approved LFS assets without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          lfs: true
          persist-credentials: false
      - name: Run UE 5.8.2 Editor build and Automation
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\Tests\Contract\Test-UEProjectBaseline.ps1" `
            -RebuildRoot $env:GITHUB_WORKSPACE `
            -UnrealEngineRoot 'C:\Program Files\Epic Games\UE_5.8' `
            -OutputPath "$env:RUNNER_TEMP\p0-12-ue-validation.json" `
            -RunAutomation
      - name: Qualify Development and Shipping packages
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\Tests\Integration\Test-UEPackagingQualification.ps1" `
            -RebuildRoot $env:GITHUB_WORKSPACE `
            -UnrealEngineRoot 'C:\Program Files\Epic Games\UE_5.8' `
            -OutputPath "$env:RUNNER_TEMP\p0-12-ue-packaging.json"

  client_ue58_build_automation:
    name: client/ue58-build-automation
    needs: client_ue58_execution
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail closed unless trusted UE execution succeeded
        shell: bash
        env:
          TMXY_EVENT_NAME: ${{ github.event_name }}
          TMXY_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          TMXY_BASE_REPOSITORY: ${{ github.repository }}
          TMXY_UE_RESULT: ${{ needs.client_ue58_execution.result }}
        run: |
          set -euo pipefail
          if [[ "${TMXY_EVENT_NAME}" == "pull_request" && \
                "${TMXY_HEAD_REPOSITORY}" != "${TMXY_BASE_REPOSITORY}" ]]; then
            echo "::error::Fork pull requests cannot execute on the TMXY self-hosted UE runner."
            exit 1
          fi
          if [[ "${TMXY_UE_RESULT}" != "success" ]]; then
            echo "::error::The isolated UE execution did not complete successfully: ${TMXY_UE_RESULT}."
            exit 1
          fi

  supply_chain_policy:
    name: supply-chain/policy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out immutable SBOM and policy inputs
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          lfs: false
          persist-credentials: false
      - name: Validate locked SBOM and fail-closed license inputs
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE/Tests/CI/Test-HostedSupplyChainPolicy.ps1" `
            -RebuildRoot $env:GITHUB_WORKSPACE `
            -Mode ContractOnly
      - name: Require protected main before authority scanning
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_API_CREDENTIAL: ${{ github.token }}
        run: |
          set -euo pipefail
          protected="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_API_CREDENTIAL}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/branches/main" | jq -r '.protected')"
          test "${protected}" = true
      - name: Install pinned Trivy without shared cache
        uses: aquasecurity/setup-trivy@e6c2c5e321ed9123bda567646e2f96565e34abe1
        with:
          version: v0.74.0
          cache: false
      - name: Scan both locked SBOMs with a current vulnerability database
        shell: bash
        run: |
          set -euo pipefail
          cache_dir="${RUNNER_TEMP}/trivy-cache"
          trivy sbom --cache-dir "${cache_dir}" --scanners vuln \
            --format json --exit-code 0 \
            --output "${RUNNER_TEMP}/postgres-vulnerabilities.json" \
            Data/Security/postgres-18.6.sbom.cdx.json
          trivy sbom --cache-dir "${cache_dir}" --scanners vuln \
            --format json --exit-code 0 \
            --output "${RUNNER_TEMP}/builder-vulnerabilities.json" \
            Data/Security/tmxy-backend-builder.sbom.cdx.json
          trivy --version --cache-dir "${cache_dir}" \
            > "${RUNNER_TEMP}/vulnerability-database-identity.txt"
      - name: Create sanitized vulnerability summary
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE/Tools/TMXY.SupplyChain/New-HostedVulnerabilitySummary.ps1" `
            -PostgresVulnerabilityReport "$env:RUNNER_TEMP/postgres-vulnerabilities.json" `
            -BuilderVulnerabilityReport "$env:RUNNER_TEMP/builder-vulnerabilities.json" `
            -VulnerabilityDatabaseIdentity "$env:RUNNER_TEMP/vulnerability-database-identity.txt" `
            -OutputPath "$env:RUNNER_TEMP/hosted-vulnerability-summary.json" `
            -Repository '${{ github.repository }}' `
            -RunId '${{ github.run_id }}' `
            -RunAttempt '${{ github.run_attempt }}' `
            -SourceRevision '${{ github.event.pull_request.head.sha || github.sha }}' `
            -WorkflowRevision '${{ github.sha }}' `
            -EventName '${{ github.event_name }}'
      - name: Evaluate exact component waiver without automatic activation
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          & "$env:GITHUB_WORKSPACE/Tools/TMXY.SupplyChain/Test-PostgresGosuWaiverDecision.ps1" `
            -RebuildRoot $env:GITHUB_WORKSPACE `
            -OutputPath "$env:RUNNER_TEMP/postgres-gosu-waiver-decision.json"
      - name: Enforce vulnerability and complete-license policy
        shell: pwsh
        run: |
          $mode = if ('${{ github.event_name }}' -eq 'push' -and '${{ github.ref }}' -eq 'refs/heads/main') {
            'HostedAuthority'
          } else {
            'MergeGate'
          }
          & "$env:GITHUB_WORKSPACE/Tests/CI/Test-HostedSupplyChainPolicy.ps1" `
            -RebuildRoot $env:GITHUB_WORKSPACE `
            -Mode $mode `
            -PostgresVulnerabilityReport "$env:RUNNER_TEMP/postgres-vulnerabilities.json" `
            -BuilderVulnerabilityReport "$env:RUNNER_TEMP/builder-vulnerabilities.json" `
            -VulnerabilityDatabaseIdentity "$env:RUNNER_TEMP/vulnerability-database-identity.txt" `
            -PostgresWaiverDecision "$env:RUNNER_TEMP/postgres-gosu-waiver-decision.json"
      - name: Retain pull-request diagnostic scan evidence
        if: github.event_name == 'pull_request' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p0-12-pr-supply-chain-${{ github.event.pull_request.number }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/postgres-vulnerabilities.json
            ${{ runner.temp }}/builder-vulnerabilities.json
            ${{ runner.temp }}/vulnerability-database-identity.txt
            ${{ runner.temp }}/hosted-vulnerability-summary.json
            ${{ runner.temp }}/postgres-gosu-waiver-decision.json
          if-no-files-found: warn
          retention-days: 7
      - name: Retain diagnostic scan evidence within the current plan limit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p0-12-supply-chain-${{ github.sha }}
          path: |
            ${{ runner.temp }}/postgres-vulnerabilities.json
            ${{ runner.temp }}/builder-vulnerabilities.json
            ${{ runner.temp }}/vulnerability-database-identity.txt
            ${{ runner.temp }}/postgres-gosu-waiver-decision.json
            ${{ runner.temp }}/hosted-vulnerability-summary.json
          if-no-files-found: error
          retention-days: 90

  release_provenance:
    name: release/provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out provenance policy without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          lfs: false
          persist-credentials: false
      - name: Validate the protected release workflow contract
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE/Tests/CI/Test-HostedWorkflowContract.ps1" `
            -RebuildRoot $env:GITHUB_WORKSPACE
