name: tmxy-dev

services:
  postgres:
    image: postgres@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    restart: unless-stopped
    environment:
      POSTGRES_DB: tmxy
      POSTGRES_USER: tmxy_dev
      POSTGRES_PASSWORD_FILE: /run/secrets/tmxy_postgres_password
    ports:
      - "127.0.0.1:${TMXY_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    stop_grace_period: 30s
    shm_size: 256mb
    volumes:
      - postgres_data:/var/lib/postgresql
    secrets:
      - tmxy_postgres_password

secrets:
  tmxy_postgres_password:
    file: "${TMXY_POSTGRES_PASSWORD_FILE:?TMXY_POSTGRES_PASSWORD_FILE must point outside the repository}"

volumes:
  postgres_data:
